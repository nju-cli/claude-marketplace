name: Sync CLI binaries

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: nju-cli release tag to package into this marketplace
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    name: Sync CLI binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          rm -rf dist unpack
          mkdir -p dist unpack
          if [ -z "${RELEASE_TAG}" ]; then
            RELEASE_TAG=$(gh release view --repo nju-cli/nju-cli --json tagName --jq .tagName)
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          gh release download "${RELEASE_TAG}" \
            --repo nju-cli/nju-cli \
            --dir dist \
            --pattern 'nju-cli-linux-x86_64.tar.gz' \
            --pattern 'nju-cli-linux-aarch64.tar.gz' \
            --pattern 'nju-cli-macos-aarch64.tar.gz' \
            --pattern 'nju-cli-windows-x86_64.zip'

      - name: Download source skills
        run: |
          mkdir -p unpack/source
          curl -fsSL \
            -o dist/nju-cli-source.tar.gz \
            "https://codeload.github.com/nju-cli/nju-cli/tar.gz/refs/tags/${RELEASE_TAG}"
          tar -C unpack/source --strip-components=1 -xzf dist/nju-cli-source.tar.gz
          test -d unpack/source/nju-cli-skills

      - name: Unpack into bin directory
        run: |
          rm -rf bin
          mkdir -p \
            bin/linux-x86_64 \
            bin/linux-aarch64 \
            bin/macos-aarch64 \
            bin/windows-x86_64

          tar -C bin/linux-x86_64  -xzf dist/nju-cli-linux-x86_64.tar.gz
          if [ -f dist/nju-cli-linux-aarch64.tar.gz ]; then
            tar -C bin/linux-aarch64 -xzf dist/nju-cli-linux-aarch64.tar.gz
          fi
          tar -C bin/macos-aarch64 -xzf dist/nju-cli-macos-aarch64.tar.gz
          unzip -q dist/nju-cli-windows-x86_64.zip -d unpack/windows

          cp unpack/windows/nju-cli.exe bin/windows-x86_64/nju-cli.exe
          chmod +x \
            bin/linux-x86_64/nju-cli \
            bin/macos-aarch64/nju-cli
          if [ -f bin/linux-aarch64/nju-cli ]; then
            chmod +x bin/linux-aarch64/nju-cli
          fi

      - name: Update skill contents
        run: |
          rm -rf skills/nju-cli
          mkdir -p skills
          cp -R unpack/source/nju-cli-skills skills/nju-cli
          python3 - <<'PY'
          from pathlib import Path

          skill_path = Path("skills/nju-cli/SKILL.md")
          skill = skill_path.read_text()
          skill = skill.replace(
              "优先使用 Codex plugin 内置的 `nju-cli` 二进制：",
              "优先使用插件内置的 `nju-cli` 二进制：",
          )
          skill = skill.replace(
              "- macOS/Linux: `scripts/nju-cli`",
              "- macOS/Linux: `${CLAUDE_PLUGIN_ROOT}/scripts/nju-cli`",
          )
          skill = skill.replace(
              "- Windows: `scripts/nju-cli.ps1`",
              "- Windows: `${CLAUDE_PLUGIN_ROOT}/scripts/nju-cli.ps1`",
          )
          skill_path.write_text(skill)
          PY

      - name: Update marketplace manifest versions
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 - <<PY
          import json
          from pathlib import Path

          marketplace_path = Path(".claude-plugin/marketplace.json")
          marketplace = json.loads(marketplace_path.read_text())
          marketplace.setdefault("metadata", {})["version"] = "${VERSION}"
          for plugin in marketplace.get("plugins", []):
              if plugin.get("name") == "nju-cli":
                  plugin["version"] = "${VERSION}"
          marketplace_path.write_text(json.dumps(marketplace, indent=2, ensure_ascii=False) + "\n")

          plugin_path = Path(".claude-plugin/plugin.json")
          plugin = json.loads(plugin_path.read_text())
          plugin["version"] = "${VERSION}"
          plugin_path.write_text(json.dumps(plugin, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Commit packaged binaries, skills, and manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin skills/nju-cli .claude-plugin/marketplace.json .claude-plugin/plugin.json
          git diff --cached --quiet && exit 0
          git commit -m "Package nju-cli ${RELEASE_TAG}"
          git push
